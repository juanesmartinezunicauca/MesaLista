name: "Performance Testing - Artillery & Lighthouse"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  performance-suite:
    name: Rendimiento Backend (Artillery) & Frontend (Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Instalar Dependencias de Rendimiento
        run: npm ci || npm install

      - name: Preparar Directorio de Reportes
        run: mkdir -p performance/reports

      - name: Paso 1 - Despertar Contenedor Backend en Render y Base de Datos
        run: |
          curl --retry 6 --retry-delay 10 --retry-all-errors "${{ secrets.STAGING_URL }}/api/docs-json" -o /dev/null
          curl --retry 3 --retry-delay 5 --retry-all-errors "${{ secrets.STAGING_URL }}/api/v1/catalogo/categorias" -o /dev/null

      - name: Paso 2 - Prueba de Carga Backend (Artillery) y Reporte HTML
        env:
          PERF_P95_THRESHOLD_MS: "2000"
        run: |
          ARTILLERY_EXIT=0
          npx artillery run performance/load-test.yml \
            --target "${{ secrets.STAGING_URL }}" \
            --overrides '{"config":{"plugins":{"ensure":{"thresholds":[{"http.response_time.p95":2000}]}}}}' \
            --output performance/reports/backend-results.json || ARTILLERY_EXIT=$?
          node performance/generate-report.js
          exit $ARTILLERY_EXIT

      - name: Paso 3 - Auditoría Frontend en la Nube (Lighthouse)
        if: ${{ !cancelled() }}
        run: |
          npx lighthouse https://mesa-lista-virid.vercel.app --output=html --output-path=./performance/reports/reporte-frontend.html --chrome-flags="--headless --no-sandbox"

      - name: Paso 4 - Subir Reportes HTML de Rendimiento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-rendimiento-html
          path: performance/reports/
          if-no-files-found: warn
          retention-days: 30
