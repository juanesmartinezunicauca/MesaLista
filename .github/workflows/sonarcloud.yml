name: SonarCloud Code Analysis

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  sonarcloud:
    name: SonarCloud Analysis (Monorepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio (Full History)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependencias y Generar Cobertura (Backend)
        run: |
          cd backend
          npm ci --ignore-scripts
          npx --no-install prisma generate
          npm run test:cov -- --passWithNoTests --runInBand
        env:
          NODE_OPTIONS: "--experimental-vm-modules --max-old-space-size=4096"

      - name: Ejecutar Escaneo en SonarCloud
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

