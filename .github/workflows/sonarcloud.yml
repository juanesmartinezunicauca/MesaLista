name: SonarCloud Code Analysis

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  sonarcloud:
    name: SonarCloud Analysis (Monorepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependencias y Generar Cobertura (Backend)
        run: |
          cd backend
          npm ci --ignore-scripts
          npx --no-install prisma generate
          npm run test:cov -- --passWithNoTests --runInBand
        env:
          NODE_OPTIONS: "--experimental-vm-modules --max-old-space-size=4096"

      - name: Ejecutar Escaneo en SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

