name: SonarCloud Code Analysis

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  sonarcloud:
    name: SonarCloud Analysis (Monorepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio (Full History)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependencias y Generar Cobertura (Backend)
        run: |
          cd backend
          npm ci --ignore-scripts || npm install --ignore-scripts
          npx --no-install prisma generate
          npm run test:cov -- --passWithNoTests --maxWorkers=2
        env:
          NODE_OPTIONS: "--experimental-vm-modules"

      - name: Ejecutar Escaneo en SonarCloud
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

