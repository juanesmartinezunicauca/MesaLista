name: "API Fuzz Testing - OpenAPI & Schemathesis"

on:
  push:
    branches: [ main, develop, '**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  api-fuzz:
    name: OpenAPI Fuzz Testing (Schemathesis & Mayhem)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependencias del Backend
        working-directory: backend
        run: npm ci || npm install

      - name: Generar Cliente de Prisma ORM
        working-directory: backend
        run: npx prisma generate

      - name: Compilar Backend (NestJS)
        working-directory: backend
        run: npm run build

      - name: Iniciar Backend en Segundo Plano para Fuzzing
        working-directory: backend
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mesalista?schema=public"
          JWT_SECRET: "test_secret_for_ci_fuzzing_super_long_32_bytes_random"
          CORS_ORIGIN: "http://localhost:4200"
        run: |
          node dist/main &
          echo "Esperando a que la API y Swagger inicien en http://localhost:3000/api/docs..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/docs-json > /dev/null; then
              echo "✅ Swagger OpenAPI 3.0 detectado y listo para Fuzz Testing."
              break
            fi
            sleep 1
          done

      - name: Ejecutar Fuzzing de API con Schemathesis (OpenAPI 3.0)
        run: |
          docker run --network="host" --rm \
            schemathesis/schemathesis:latest \
            run http://localhost:3000/api/docs-json \
            --checks all \
            --validate-schema=true \
            --hypothesis-max-examples=25 \
            --exitfirst=false || true

      - name: Ejecutar Mayhem for API (Opcional si MAPI_TOKEN está configurado)
        if: env.MAPI_TOKEN != ''
        uses: ForAllSecure/mapi-action@v1
        env:
          MAPI_TOKEN: ${{ secrets.MAPI_TOKEN }}
        with:
          mapi-token: ${{ secrets.MAPI_TOKEN }}
          api-url: http://localhost:3000/api/v1
          api-spec: http://localhost:3000/api/docs-json
