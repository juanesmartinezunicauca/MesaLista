name: "API Fuzz Testing - OpenAPI & Schemathesis"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  api-fuzz:
    name: OpenAPI Fuzz Testing (Schemathesis & Mayhem)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAYHEM_TOKEN: ${{ secrets.MAYHEM_TOKEN || secrets.MAPI_TOKEN }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mesalista
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependencias del Backend
        working-directory: backend
        run: npm ci || npm install

      - name: Generar Cliente de Prisma ORM
        working-directory: backend
        run: npx prisma generate

      - name: Preparar Esquema y Usuario Efímero de Fuzzing en CI
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mesalista?schema=public"
        run: |
          npx prisma db push --skip-generate
          node -e '
            const crypto = require("crypto");
            const jwt = require("jsonwebtoken");
            const { PrismaClient } = require("@prisma/client");
            const prisma = new PrismaClient();
            (async () => {
              const user = await prisma.usuario.upsert({
                where: { usuario: "ci_fuzzer_admin" },
                update: { estado: "activo", rol: "administrador" },
                create: { nombre: "CI Fuzzer Admin", usuario: "ci_fuzzer_admin", rol: "administrador", estado: "activo" },
              });
              const secret = crypto.randomBytes(32).toString("hex");
              const token = jwt.sign({ sub: user.id_usuario, usuario: user.usuario, rol: user.rol }, secret, { expiresIn: "1h" });
              const fs = require("fs");
              console.log("::add-mask::" + secret);
              console.log("::add-mask::" + token);
              fs.appendFileSync(process.env.GITHUB_ENV, "CI_JWT_SECRET=" + secret + "\nCI_AUTH_TOKEN=" + token + "\n");
              await prisma.$disconnect();
            })().catch((e) => { console.error(e); process.exit(1); });
          '

      - name: Compilar Backend (NestJS)
        working-directory: backend
        run: npm run build

      - name: Iniciar Backend en Segundo Plano para Fuzzing
        working-directory: backend
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mesalista?schema=public"
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          CORS_ORIGIN: "http://localhost:4200"
        run: |
          nohup node dist/main > /tmp/backend.log 2>&1 &
          echo "Esperando a que la API y Swagger inicien en http://localhost:3000/api/docs..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/docs-json > /dev/null; then
              echo "✅ Swagger OpenAPI 3.0 detectado y listo para Fuzz Testing."
              break
            fi
            sleep 1
          done

      - name: Ejecutar Fuzzing de API con Schemathesis (OpenAPI 3.0)
        run: |
          docker run --network="host" --rm \
            schemathesis/schemathesis:latest \
            run http://localhost:3000/api/docs-json \
            -H "Authorization: Bearer ${{ env.CI_AUTH_TOKEN }}" \
            --checks not_a_server_error \
            --max-examples 20 \
            --wait-for-schema 30

      - name: Ejecutar Mayhem for API (Si MAYHEM_TOKEN o MAPI_TOKEN está configurado)
        if: env.MAYHEM_TOKEN != ''
        uses: ForAllSecure/mapi-action@v2
        with:
          mayhem-token: ${{ env.MAYHEM_TOKEN }}
          target: juanesmartinezunicauca/mesalista/api
          api-url: http://localhost:3000
          api-spec: http://localhost:3000/api/docs-json
          duration: 1m
          run-args: |
            --header
            Authorization: Bearer ${{ env.CI_AUTH_TOKEN }}
