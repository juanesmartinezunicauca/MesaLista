name: "DAST - OWASP ZAP Dynamic Security Scan"

on:
  schedule:
    - cron: '0 4 * * 0' # Auditoría semanal los domingos a las 04:00 UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL objetivo para el escaneo DAST (dejar en blanco para usar STAGING_URL)'
        required: false
        default: ''

jobs:
  dast_scan:
    name: OWASP ZAP Baseline Scan (DAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Para registrar alertas de seguridad detectadas si aplica

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Determinar URL Objetivo
        id: determine_target
        run: |
          TARGET="${{ github.event.inputs.target_url }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ secrets.STAGING_URL || vars.STAGING_URL || 'https://mesa-lista-virid.vercel.app' }}"
          fi
          echo "target_url=$TARGET" >> "$GITHUB_OUTPUT"
          echo "🎯 Objetivo DAST configurado: $TARGET"

      - name: Ejecutar Escaneo Dinámico OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: ${{ steps.determine_target.outputs.target_url }}
          issue_title: '🚨 Alerta de Seguridad DAST - OWASP ZAP'
          allow_issue_writing: false
          cmd_options: '-a -j'

