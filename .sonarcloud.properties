# =====================================================================
#  CONFIGURACIÓN DE ANÁLISIS AUTOMÁTICO SONARCLOUD — MESALISTA
# =====================================================================

sonar.projectKey=juanesmartinezunicauca_MesaLista
sonar.organization=juanesmartinezunicauca
sonar.projectName=MesaLista POS & ERP
sonar.sourceEncoding=UTF-8

# Código fuente
sonar.sources=backend/src,frontend/src/app

# Pruebas unitarias
sonar.tests=backend/src,backend/test,frontend/src/app
sonar.test.inclusions=**/*.spec.ts,backend/test/**/*.ts

# Exclusiones de análisis estático
sonar.exclusions=**/node_modules/**,**/dist/**,**/reports/**,backend/reports/**,**/coverage/**,backend/prisma/**,**/*.html,**/*.scss,**/*.bat,**/*.md,**/*.json

# Exclusiones de detección de código duplicado (CPD)
sonar.cpd.exclusions=**/*

# Cobertura y TypeScript
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json
