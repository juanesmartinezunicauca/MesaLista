server {
    listen 80;

    # A-04: Ocultar versión de Nginx al atacante
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # A-04: Headers de seguridad HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Ajustar CSP cuando se integren fuentes externas (Google Fonts, etc.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

    # A-04: SPA routing — Angular Router con HTML5 mode
    # Sin esto, recargar /mesas produce un 404 desde Nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets estáticos con caché agresivo (Angular genera hashes en el nombre)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Bloquear acceso a archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
