<div class="apertura-caja-layout">

  <mat-card class="caja-card">
    <mat-card-content class="card-container">

      <!-- Icono de Candado Superior -->
      <div class="lock-icon-container">
        <mat-icon class="lock-icon-top">lock</mat-icon>
      </div>

      <!-- Títulos e Información -->
      <h2 class="card-title">Caja Cerrada</h2>
      <p class="card-description">
        No hay caja abierta hoy. Ingrese el valor base para comenzar las operaciones del día.
      </p>

      <!-- Campo de Entrada (Input) -->
      <div class="input-container">
        <label class="input-label">Valor base inicial</label>
        <mat-form-field appearance="outline" class="full-width">
          <span matPrefix style="margin-left: 15px" class="currency-prefix">$ &nbsp;</span>
          <input matInput type="text" placeholder="0" (keypress)="soloNumeros($event)">
        </mat-form-field>
      </div>


      <!-- Botón de Acción -->
      <button mat-flat-button color="primary" class="btn-abrir-caja" [routerLink]="['/caja', 'dashboard']">
        <mat-icon>lock</mat-icon>
        Abrir Caja
      </button>

    </mat-card-content>
  </mat-card>

</div>
