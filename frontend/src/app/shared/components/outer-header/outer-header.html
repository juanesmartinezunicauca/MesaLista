<header class="app-outer-header">
  <div class="header-left">
    <span class="view-tag">MesaLista POS</span>
  </div>

  <div class="user-session-container">
    <div class="user-meta">
      <span class="user-name">{{ currentUser().nombre }}</span>
      <span class="user-role">{{ currentUser().rol }}</span>
    </div>

    <button
      type="button"
      mat-icon-button
      [matMenuTriggerFor]="userMenu"
      aria-label="Menú de usuario"
      class="avatar-btn"
    >
      <span class="avatar-badge">{{ currentUser().iniciales }}</span>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      <button type="button" mat-menu-item (click)="abrirMiPerfil()">
        <mat-icon>account_circle</mat-icon>
        <span>Mi Perfil</span>
      </button>

      @if (currentUser().rol === 'administrador') {
        <button type="button" mat-menu-item routerLink="/usuarios">
          <mat-icon>manage_accounts</mat-icon>
          <span>Gestión de Personal</span>
        </button>
      }

      <mat-divider></mat-divider>

      <button type="button" mat-menu-item (click)="onLogout()">
        <mat-icon color="warn">logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  </div>
</header>
