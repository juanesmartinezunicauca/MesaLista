<aside class="sidebar" [class.collapsed]="isCollapsed()">
  <a class="sidebar-brand" routerLink="/mesas" matTooltip="Ir a vista principal">
    <div class="logo-badge">
      <mat-icon>restaurant_menu</mat-icon>
    </div>
    <div class="brand-info">
      <h2>MESALISTA</h2>
      <span class="venue-sub">LUIGIE'S</span>
    </div>
  </a>

  <nav class="sidebar-nav">
    @for (item of navItemsFiltrados(); track item.route) {
      @let badge = obtenerBadge(item.route);
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
        [matTooltip]="obtenerTooltip(item)"
        matTooltipPosition="right"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
        @if (badge > 0) {
          <span
            class="nav-badge"
            [attr.aria-label]="badge + (badge === 1 ? ' solicitud pendiente' : ' solicitudes pendientes')"
          >
            {{ formatearBadge(badge) }}
          </span>
        }
      </a>
    }
  </nav>
</aside>
