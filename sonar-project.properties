# =====================================================================
#  CONFIGURACIÓN DE ANÁLISIS ESTÁTICO SONARQUBE / SONARCLOUD — MESALISTA
#  Proyecto: MesaLista (Grupo Trinity — Universidad del Cauca, 2026)
# =====================================================================

# Clave única y metadatos del proyecto
# Para SonarCloud, suele ser tu-usuario_MesaLista (se autogenera al importar en sonarcloud.io)
sonar.projectKey=mesalista-pos
sonar.projectName=MesaLista POS & ERP
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Descomenta y define tu organización si usas SonarCloud en la nube:
# sonar.organization=juanesmartinezunicauca

# Rutas de código fuente (Monorepo: Backend NestJS + Frontend Angular)
sonar.sources=backend/src,frontend/src/app

# Rutas de pruebas unitarias
sonar.tests=backend/src,backend/test,frontend/src/app
sonar.test.inclusions=**/*.spec.ts,backend/test/**/*.ts

# Exclusiones de análisis (archivos compilados, dependencias, assets, schemas y base de datos)
sonar.exclusions=**/node_modules/**,**/dist/**,**/reports/**,**/coverage/**,backend/prisma/**,**/*.html,**/*.scss,**/*.bat,**/*.md,**/*.json

# Rutas de reporte de cobertura de pruebas (LCOV generado por Jest)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Configuración de compilación TypeScript
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json
